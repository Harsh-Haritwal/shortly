<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Shortly — URL Shortener</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:#0f1117;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

color:white;

}

.container{

width:500px;

background:#171b24;

padding:40px;

border-radius:20px;

box-shadow:
0 10px 40px
rgba(0,0,0,.4);

}

h1{

text-align:center;

margin-bottom:30px;

color:#5b8cff;

}

.input-box{

display:flex;

flex-direction:column;

gap:15px;

}

input{

padding:16px;

border:none;

border-radius:12px;

background:#242a36;

color:white;

font-size:16px;

outline:none;

}

button{

padding:16px;

border:none;

border-radius:12px;

background:#5b8cff;

color:white;

font-size:16px;

cursor:pointer;

transition:.3s;

}

button:hover{

opacity:.9;

}

.result{

margin-top:25px;

display:none;

}

.link{

display:flex;

gap:10px;

margin-top:10px;

}

.link input{

flex:1;

}

.copy{

background:#29c36a;

}

.loading{

display:none;

text-align:center;

margin-top:15px;

}

.error{

color:#ff5555;

margin-top:15px;

}

</style>

</head>

<body>

<div class="container">

<h1>Shortly</h1>

<div class="input-box">

<input
type="text"
id="url"
placeholder=
"Paste your long URL">

<button
onclick="shorten()">

Generate Short URL

</button>

</div>

<div
class="loading"
id="loading">

Generating...

</div>

<div
class="error"
id="error">

</div>

<div
class="result"
id="result">

<h3>Your Short URL</h3>

<div class="link">

<input
id="shortLink"
readonly>

<button
class="copy"
onclick="copyLink()">

Copy

</button>

</div>

</div>

</div>

<script>

const API =

"https://ueea275471.execute-api.us-east-1.amazonaws.com/production/shorten";

async function shorten(){

const url =
document
.getElementById("url")
.value;

const loading =
document
.getElementById("loading");

const error =
document
.getElementById("error");

const result =
document
.getElementById("result");

error.innerHTML="";

result.style.display="none";

if(!url){

error.innerHTML=
"Enter URL";

return;

}

loading.style.display=
"block";

try{

const res =
await fetch(
API,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

longUrl:url

})

}

);

const data =
await res.json();

document
.getElementById(
"shortLink"
)
.value =
data.shortUrl;

result
.style
.display=
"block";

}
catch{

error.innerHTML=
"Failed";

}

loading.style.display=
"none";

}

function copyLink(){

const link =
document
.getElementById(
"shortLink"
);

link.select();

navigator
.clipboard
.writeText(
link.value
);

alert(
"Copied"
);

}

</script>

</body>

</html>
